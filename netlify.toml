# Minimal redirects — let Netlify serve static files by default
# Only add explicit redirects where needed

# Audit tool paths
[[redirects]]
  from = "/audit"
  to = "/audit/index.html"
  status = 200

[[redirects]]
  from = "/audit/"
  to = "/audit/index.html"
  status = 200

# Blog post
[[redirects]]
  from = "/blog-chatgpt-backlink"
  to = "/blog-chatgpt-backlink.html"
  status = 200

# Media kit
[[redirects]]
  from = "/media-kit"
  to = "/media-kit.html"
  status = 200
